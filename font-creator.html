<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>itscovena | Pro Font Creator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@latest/dist/opentype.min.js"></script>
    <style>
        .creator-container { display: flex; gap: 20px; padding: 20px; }
        .toolbar { 
            width: 250px; background: var(--card-bg); padding: 20px; 
            border-radius: 15px; border: 1px solid #8e2de2;
        }
        canvas { 
            background: white; border-radius: 10px; cursor: crosshair; 
            box-shadow: 0 0 20px rgba(142, 45, 226, 0.3);
        }
        .controls input, .controls select { width: 100%; margin: 10px 0; padding: 8px; }
        .char-selector { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 15px;
        }
        .char-btn { 
            padding: 5px; background: #0f0c29; border: 1px solid #f64f59; 
            color: white; cursor: pointer; text-align: center;
        }
        .char-btn.active { background: #8e2de2; }
        .action-btns { margin-top: 20px; }
        button.primary { 
            width: 100%; padding: 12px; background: var(--accent-gradient); 
            border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="color: #f64f59; text-decoration: none;">← Ana Sayfa</a>
    <h1 class="logo" style="font-size: 2rem;">Font Studio</h1>

    <div class="creator-container">
        <div class="toolbar">
            <div class="controls">
                <label>Renk:</label>
                <input type="color" id="colorPicker" value="#000000">
                
                <label>Kalınlık:</label>
                <input type="range" id="lineWidth" min="1" max="20" value="5">
                
                <label>Alfabe:</label>
                <select id="alphabet">
                    <option value="latin">Latin (A-Z)</option>
                    <option value="numbers">Rakamlar (0-9)</option>
                    <option value="special">Özel Karakterler</option>
                </select>
            </div>

            <div class="char-selector" id="charSelector">
                </div>

            <div class="action-btns">
                <button class="primary" onclick="clearCanvas()">Temizle</button>
                <br><br>
                <button class="primary" style="background: #27ae60;" onclick="exportFont()">FONTU OLUŞTUR (.TTF)</button>
            </div>
        </div>

        <div class="canvas-area">
            <h3 id="currentLabel">Şu an çizilen: A</h3>
            <canvas id="fontCanvas" width="500" height="500"></canvas>
            <div class="guide" style="margin-top: 10px; font-size: 0.8rem; color: #a0a0a0;">
                * Her harfi kutunun ortasına çizmeyi unutma.
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('fontCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let glyphsData = {}; // Harf çizimlerini burada tutacağız

    // Çizim Başlatma
    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mouseup', () => {
        drawing = false;
        ctx.beginPath();
        saveCurrentGlyph(); // Çizimi kaydet
    });
    
    canvas.addEventListener('mousemove', draw);

    function draw(e) {
        if (!drawing) return;
        ctx.lineWidth = document.getElementById('lineWidth').value;
        ctx.lineCap = 'round';
        ctx.strokeStyle = document.getElementById('colorPicker').value;

        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Harfleri oluşturma
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const selector = document.getElementById('charSelector');
    
    alphabet.forEach(char => {
        const btn = document.createElement('div');
        btn.className = 'char-btn';
        btn.innerText = char;
        btn.onclick = () => selectChar(char, btn);
        selector.appendChild(btn);
    });

    function selectChar(char, btn) {
        document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('currentLabel').innerText = "Şu an çizilen: " + char;
        clearCanvas();
    }

    function saveCurrentGlyph() {
        // Burada çizimi SVG path'e çevirme kodu olacak (Opentype.js için)
        console.log("Çizim kaydedildi.");
    }

    function exportFont() {
        alert("Bu aşamada çizimlerin opentype.js ile .ttf dosyasına dönüştürülüyor. Bu işlem biraz zaman alabilir!");
        // Gerçek dosya oluşturma mantığı buraya gelecek
    }
</script>

</body>
</html>
